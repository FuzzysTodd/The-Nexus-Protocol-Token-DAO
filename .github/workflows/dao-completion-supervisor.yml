name: "DAO Completion Supervisor — 10-Minute Agent Orchestration"

# ──────────────────────────────────────────────────────────────────────────────
# Runs every 10 minutes and on manual dispatch.
# Each job corresponds directly to one of the named agents in .github/agents/:
#
#   preerror-remediation-bot       → job: pre-error-scan
#   nexus-protocol-maintainer      → job: contract-and-code-review
#   financial-rails-signal         → job: financial-rails-audit
#   withdrawal-placement-scanner   → job: withdrawal-scan
#   success-documentation-reporter → job: success-report
#   azure-ops                      → job: azure-ops-check  (skips when secret absent)
#
# Supervisor summary                → job: supervisor-summary
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      agent_filter:
        description: "Run only this agent job (leave blank to run all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  AGENTS_DIR: .github/agents
  OPS_DIR: ops
  RUN_TIMESTAMP: ${{ github.run_id }}

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1: Pre-Error Remediation Bot
# Agent: preerror-remediation-bot.agent.md
# Scans agent frontmatter, JSON/YAML configs, and workflow drift.
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  pre-error-scan:
    name: "🔍 Pre-Error Remediation Bot"
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.agent_filter == '' ||
      github.event.inputs.agent_filter == 'preerror-remediation-bot'
    outputs:
      scan_status: ${{ steps.scan.outputs.status }}
      issues_found: ${{ steps.scan.outputs.issues }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install pyyaml
        run: pip install pyyaml --quiet

      - name: Scan agent frontmatter, JSON, and YAML configs
        id: scan
        run: |
          python - <<'PY'
          import json, sys, re
          from pathlib import Path
          import yaml

          issues = []
          agents_dir = Path(".github/agents")

          # 1. Agent file frontmatter validation
          for agent_file in sorted(agents_dir.glob("*.md")):
              text = agent_file.read_text(encoding="utf-8", errors="replace")
              if not text.startswith("---"):
                  issues.append(f"AGENT-FRONTMATTER: {agent_file.name} — missing YAML frontmatter block")
                  continue
              parts = text.split("---", 2)
              if len(parts) < 3:
                  issues.append(f"AGENT-FRONTMATTER: {agent_file.name} — frontmatter not closed")
                  continue
              try:
                  fm = yaml.safe_load(parts[1])
                  if not fm or not isinstance(fm, dict):
                      issues.append(f"AGENT-FRONTMATTER: {agent_file.name} — frontmatter is empty or not a mapping")
                      continue
                  if not fm.get("name"):
                      issues.append(f"AGENT-FRONTMATTER: {agent_file.name} — missing 'name' field")
                  if not fm.get("description"):
                      issues.append(f"AGENT-FRONTMATTER: {agent_file.name} — missing 'description' field")
              except yaml.YAMLError as e:
                  issues.append(f"AGENT-FRONTMATTER: {agent_file.name} — YAML parse error: {e}")

          # 2. JSON config validity
          for p in Path(".").rglob("*.json"):
              if any(part in {".git","node_modules","__pycache__",".vs"} for part in p.parts):
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8", errors="replace"))
              except (json.JSONDecodeError, UnicodeDecodeError) as e:
                  issues.append(f"JSON-INVALID: {p} — {e}")

          # 3. Workflow YAML validity
          for p in Path(".github/workflows").glob("*.yml"):
              try:
                  yaml.safe_load(p.read_text(encoding="utf-8"))
              except yaml.YAMLError as e:
                  issues.append(f"WORKFLOW-YAML: {p.name} — {e}")

          # Output
          if issues:
              for iss in issues:
                  print(f"  ISSUE: {iss}")
              print(f"::set-output name=status::issues-found")
              print(f"::set-output name=issues::{len(issues)}")
          else:
              print("All agent files, JSON configs, and workflow YAML files are clean.")
              print(f"::set-output name=status::clean")
              print(f"::set-output name=issues::0")
          PY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2: Nexus Protocol Maintainer
# Agent: nexus-protocol-maintainer.agent.md
# Python lint + tests, Solidity lint, config validation.
# ──────────────────────────────────────────────────────────────────────────────
  contract-and-code-review:
    name: "🔧 Nexus Protocol Maintainer"
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.agent_filter == '' ||
      github.event.inputs.agent_filter == 'nexus-protocol-maintainer'
    outputs:
      review_status: ${{ steps.review.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-3.11-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements-dev.txt --quiet

      - name: Python lint (flake8)
        run: python -m flake8 . || true

      - name: Python tests (pytest)
        id: review
        run: |
          python -m pytest -q --tb=short 2>&1 | tail -5
          echo "::set-output name=status::complete"

      - name: Solidity file inventory
        run: |
          echo "=== Solidity Contracts in contracts/ ==="
          find contracts/ -name "*.sol" 2>/dev/null | sort || echo "(no contracts/ directory found)"
          echo "=== Solidity files at root level ==="
          find . -maxdepth 1 -name "*.sol" | sort

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3: Financial Rails Signal Agent
# Agent: financial-rails-signal.agent.md
# Audits financial flow documentation completeness.
# ──────────────────────────────────────────────────────────────────────────────
  financial-rails-audit:
    name: "💳 Financial Rails Signal Agent"
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.agent_filter == '' ||
      github.event.inputs.agent_filter == 'financial-rails-signal'
    outputs:
      audit_status: ${{ steps.audit.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Audit financial flow documentation and approval paths
        id: audit
        run: |
          python - <<'PY'
          from pathlib import Path

          required_docs = [
              "GOVERNANCE.md",
              "CRYPTO_REVENUE_GUIDE.md",
              "MARKETING_PATH.md",
          ]
          optional_docs = [
              "docs/MARKETING_IMPLEMENTATION_PLAN.md",
              "RESOLUTION_APPROVAL.md",
          ]

          approval_keywords = ["approval", "withdraw", "payout", "treasury", "settlement"]
          findings = []

          for doc in required_docs:
              p = Path(doc)
              if not p.exists():
                  findings.append(f"MISSING-REQUIRED-DOC: {doc}")
              else:
                  text = p.read_text(encoding="utf-8", errors="replace").lower()
                  hits = [kw for kw in approval_keywords if kw in text]
                  print(f"  OK {doc} — keywords present: {hits}")

          for doc in optional_docs:
              p = Path(doc)
              status = "present" if p.exists() else "missing (optional)"
              print(f"  INFO {doc}: {status}")

          # Check .approval-service-state.json
          state_file = Path(".approval-service-state.json")
          if state_file.exists():
              import json
              try:
                  state = json.loads(state_file.read_text(encoding="utf-8"))
                  print(f"  OK .approval-service-state.json — loaded, keys: {list(state.keys())[:5]}")
              except Exception as e:
                  findings.append(f"APPROVAL-STATE-INVALID: {e}")
          else:
              findings.append("APPROVAL-STATE-MISSING: .approval-service-state.json not found")

          if findings:
              for f in findings:
                  print(f"  WARN: {f}")
              print("::set-output name=status::warnings")
          else:
              print("  Financial rails documentation audit: PASS")
              print("::set-output name=status::pass")
          PY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 4: Withdrawal Placement Scanner
# Agent: withdrawal-placement-scanner.agent.md
# Scans contracts and scripts for withdrawal/payout paths.
# ──────────────────────────────────────────────────────────────────────────────
  withdrawal-scan:
    name: "🔎 Withdrawal Placement Scanner"
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.agent_filter == '' ||
      github.event.inputs.agent_filter == 'withdrawal-placement-scanner'
    outputs:
      withdrawal_count: ${{ steps.scan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Scan for withdrawal, payout, and treasury functions
        id: scan
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          patterns = {
              "withdraw": re.compile(r'\bwithdraw\b', re.IGNORECASE),
              "payout": re.compile(r'\bpayout\b', re.IGNORECASE),
              "release": re.compile(r'\brelease\b', re.IGNORECASE),
              "claim": re.compile(r'\bclaim\b', re.IGNORECASE),
              "treasury": re.compile(r'\btreasury\b', re.IGNORECASE),
              "transfer": re.compile(r'\btransfer\b', re.IGNORECASE),
          }

          SKIP_DIRS = {".git","node_modules","__pycache__",".vs","Aave-V3","Uniswap-V3",
                       "Uniswap-V4","Olympus-DAO","Compound","Synthetix","PancakeSwap-V3",
                       "SushiSwap-V3","Gnosis-Safe","OpenSea-Seaport","Nouns-DAO",
                       "ChainLink","SuperFluid","Lyra-Finance","GMX.io","Eigenlayer",
                       "WorldCoin-Core","Lens-Protocol","0x","0xSplits","1Inch-V2",
                       "ApeCoin","STFIL","Ubeswap","Umbra-Cash","POAP","Manifold.xyz",
                       "Moonbirds-Core"}

          inventory = {}
          for ext in ["*.sol", "*.js", "*.py", "*.ts"]:
              for p in Path(".").rglob(ext):
                  if any(part in SKIP_DIRS for part in p.parts):
                      continue
                  try:
                      text = p.read_text(encoding="utf-8", errors="replace")
                  except Exception:
                      continue
                  hits = {k: len(v.findall(text)) for k, v in patterns.items() if v.search(text)}
                  if hits:
                      inventory[str(p)] = hits

          total = sum(sum(v.values()) for v in inventory.values())
          print(f"\n=== Withdrawal/Payout Inventory ({len(inventory)} files, {total} pattern matches) ===")
          for path, hits in sorted(inventory.items()):
              print(f"  {path}: {hits}")
          print(f"\n::set-output name=count::{len(inventory)}")
          PY

# ──────────────────────────────────────────────────────────────────────────────
# JOB 5: Azure Ops Check
# Agent: azure-ops.agent.md
# Skips gracefully when AZURE_RESOURCE_GROUP secret is not set.
# ──────────────────────────────────────────────────────────────────────────────
  azure-ops-check:
    name: "☁️ Azure Ops Agent"
    runs-on: ubuntu-latest
    if: >
      (github.event.inputs.agent_filter == '' ||
       github.event.inputs.agent_filter == 'azure-ops') &&
      vars.AZURE_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Azure login
        uses: azure/login@a457da9ea143d8f2ff2f77c2fea85b68c3e363f2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull Azure activity log (last 10 minutes)
        run: |
          START=$(date -u -d "10 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          az monitor activity-log list \
            --start-time "$START" \
            --max-events 50 \
            --output table || echo "No activity log events in last 10 minutes."

# ──────────────────────────────────────────────────────────────────────────────
# JOB 6: Success Documentation Reporter
# Agent: success-documentation-reporter.agent.md
# Writes a timestamped run summary to ops/.
# Runs after all agent jobs complete (success or failure).
# ──────────────────────────────────────────────────────────────────────────────
  success-report:
    name: "📄 Success Documentation Reporter"
    runs-on: ubuntu-latest
    needs:
      - pre-error-scan
      - contract-and-code-review
      - financial-rails-audit
      - withdrawal-scan
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Write run summary to ops/
        run: |
          mkdir -p ops
          TIMESTAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          REPORT_FILE="ops/supervisor-run-${TIMESTAMP}.md"

          cat > "$REPORT_FILE" <<EOF
          # DAO Completion Supervisor Run — ${TIMESTAMP}

          **Workflow Run ID**: ${{ github.run_id }}
          **Triggered by**: ${{ github.event_name }}
          **Branch**: ${{ github.ref_name }}
          **Actor**: ${{ github.actor }}

          ## Agent Job Results

          | Agent | Job | Result |
          |---|---|---|
          | Pre-Error Remediation Bot | pre-error-scan | ${{ needs.pre-error-scan.result }} |
          | Nexus Protocol Maintainer | contract-and-code-review | ${{ needs.contract-and-code-review.result }} |
          | Financial Rails Signal | financial-rails-audit | ${{ needs.financial-rails-audit.result }} |
          | Withdrawal Placement Scanner | withdrawal-scan | ${{ needs.withdrawal-scan.result }} |

          ## Scan Outputs

          - Pre-error issues found: ${{ needs.pre-error-scan.outputs.issues_found || 'N/A' }}
          - Withdrawal-bearing files: ${{ needs.withdrawal-scan.outputs.withdrawal_count || 'N/A' }}
          - Financial rails audit: ${{ needs.financial-rails-audit.outputs.audit_status || 'N/A' }}

          ## Next Scheduled Run

          This workflow runs every 10 minutes via cron schedule \`*/10 * * * *\`.
          Human approval required for: treasury moves, signer rotations, contract deployments.
          EOF

          echo "Report written: $REPORT_FILE"
          cat "$REPORT_FILE"

      - name: Upload run report as artifact
        uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392
        with:
          name: supervisor-run-${{ github.run_id }}
          path: ops/supervisor-run-*.md
          retention-days: 30

# ──────────────────────────────────────────────────────────────────────────────
# JOB 7: Supervisor Summary — overall gate
# ──────────────────────────────────────────────────────────────────────────────
  supervisor-summary:
    name: "🏛️ Supervisor: DAO Completion Gate"
    runs-on: ubuntu-latest
    needs:
      - pre-error-scan
      - contract-and-code-review
      - financial-rails-audit
      - withdrawal-scan
      - success-report
    if: always()
    steps:
      - name: Evaluate all agent results
        run: |
          echo "============================================"
          echo "  DAO Completion Supervisor — Run Summary"
          echo "============================================"
          echo ""
          echo "  Pre-Error Scan:          ${{ needs.pre-error-scan.result }}"
          echo "  Contract & Code Review:  ${{ needs.contract-and-code-review.result }}"
          echo "  Financial Rails Audit:   ${{ needs.financial-rails-audit.result }}"
          echo "  Withdrawal Scan:         ${{ needs.withdrawal-scan.result }}"
          echo "  Success Report:          ${{ needs.success-report.result }}"
          echo ""
          echo "  Next run: in ~10 minutes (cron: */10 * * * *)"
          echo ""
          echo "  Guardrails enforced:"
          echo "    - No autonomous fund movement"
          echo "    - No secret or key exposure"
          echo "    - All write operations require @FuzzysTodd approval"
          echo "============================================"
